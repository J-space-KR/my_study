<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J-space 다이어리</title>
    <link rel= "stylesheet" href="./a.css"/>

    <script src="./script.js" defer></script>
 
</head>
<body>
    <div class="페이지">
        <div class="상단">
            <div class="로고" onclick="location.href='./homework-example.html'">J-space의 뭔가 즐겁기도 하고, 아무 생각 없기도 하고, 가끔 뛰쳐나가고도 싶은 다이어리 

</div>
            <label class="다크모드">
                <div>다크모드</div>
                <input class="스위치" type="checkbox" onclick="메인다크모드바꾸기()" />
            </label>
        </div>

        <div class="배너">
            <video class="배너비디오" autoplay muted loop playsinline>
                <source src="./assets/earth.mp4" type="video/mp4" />
            </video>
        </div>



     

        

        <div class="탭">
            <div class="탭버튼 선택된탭" id="일기탭" onclick="메뉴이동('일기')">일기보관함</div>
            <div class="탭버튼" id="사진탭" onclick="메뉴이동('사진')">사진보관함</div>
        </div>

        <div id="일기메뉴">
            <div class="검색영역">
                <div class="필터">
                    <input class="드롭다운제목" id="필터드롭다운" type="checkbox" />
                    <ul class="드롭다운목록">
                        <li><input id="전체필터" type="radio" name="감정필터" value="전체" onclick="감정바꾸기(event)" checked /><label for="전체필터">전체</label></li>
                        <li><input id="행복필터" type="radio" name="감정필터" value="행복해요" onclick="감정바꾸기(event)" /><label for="행복필터">행복해요</label></li>
                        <li><input id="슬픔필터" type="radio" name="감정필터" value="슬퍼요" onclick="감정바꾸기(event)" /><label for="슬픔필터">슬퍼요</label></li>
                        <li><input id="놀람필터" type="radio" name="감정필터" value="놀랐어요" onclick="감정바꾸기(event)" /><label for="놀람필터">놀랐어요</label></li>
                        <li><input id="화남필터" type="radio" name="감정필터" value="화나요" onclick="감정바꾸기(event)" /><label for="화남필터">화나요</label></li>
                        <li><input id="기타필터" type="radio" name="감정필터" value="기타" onclick="감정바꾸기(event)" /><label for="기타필터">기타</label></li>
                    </ul>
                </div>
                <input class="검색창" type="text" placeholder="🔍  검색어를 입력해 주세요." oninput="검색어바꾸기(event)" />
                <button class="글쓰기버튼" onclick="모달열기('등록모달배경')">＋ 일기쓰기</button>
            </div>

            <div class="일기목록" id="일기목록"></div>
            <div class="페이지번호영역" id="페이지번호영역"></div>
        </div>

        <div class="사진메뉴" id="사진메뉴">
            <div class="사진도구">
                <select class="비율선택" onchange="사진비율바꾸기(event)">
                    <option value="기본형">기본형 1:1</option>
                    <option value="가로형">가로형 4:3</option>
                    <option value="세로형">세로형 3:4</option>
                </select>
            </div>
            <div class="강아지사진목록 기본형" id="강아지사진목록"></div>
        </div>
    </div>

    <div class="하단바깥">
        <div class="하단">
            <div class="하단제목">J-space의 다이어리</div>
            <div class="하단글씨">CEO : J-space</div>
            <div class="하단글씨">Copyright © 2026. J-space의 Co.Ltd.</div>
        </div>
    </div>

    <button class="위로버튼" onclick="맨위로가기()">⌃</button>

    <div class="모달배경" id="등록모달배경" onclick="모달닫기('등록모달배경')">
        <div class="모달" onclick="event.stopPropagation()">
            <div class="모달제목">일기 쓰기</div>

            <div class="입력묶음">
                <div class="입력라벨"><b>오늘 기분은 어땠나요?</b></div>
                <div class="감정목록">
                    <label><input id="행복" type="radio" name="emotion" checked /> 행복해요</label>
                    <label><input id="슬픔" type="radio" name="emotion" /> 슬퍼요</label>
                    <label><input id="놀람" type="radio" name="emotion" /> 놀랐어요</label>
                    <label><input id="화남" type="radio" name="emotion" /> 화나요</label>
                    <label><input id="기타" type="radio" name="emotion" /> 기타</label>
                </div>
            </div>

            <div class="입력묶음">
                <div class="입력라벨">제목</div>
                <input class="제목입력" id="제목" type="text" placeholder="제목을 입력해 주세요." oninput="등록버튼확인하기()" />
            </div>

            <div class="입력묶음">
                <div class="입력라벨">내용</div>
                <textarea class="내용입력" id="내용" placeholder="내용을 입력해 주세요." oninput="등록버튼확인하기()"></textarea>
            </div>

            <div class="모달버튼영역">
                <button class="닫기버튼" onclick="모달닫기('등록모달배경')">닫기</button>
                <button class="등록버튼" id="등록버튼" onclick="일기등록하기()" disabled>등록하기</button>
            </div>
        </div>
    </div>

    <!-- 등록 모달보다 위에 겹쳐지는 등록 완료 모달이에요. -->
    <div class="모달배경 완료모달배경" id="등록완료모달배경" onclick="등록모달모두닫기()">
        <div class="등록완료모달" onclick="event.stopPropagation()">
            <div class="완료메시지">등록이 완료되었습니다.</div>
            <button class="확인버튼" onclick="등록모달모두닫기()">확인</button>
        </div>
    </div>
</body>
</html>
